<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Car Market Place</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background: #f7fafd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #222;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 220px;
            background: #fff;
            box-shadow: 2px 0 12px rgba(41,128,185,0.07);
            padding: 2rem 1rem 1rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 10;
        }
        .sidebar h2 {
            color: #2980b9;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #2980b9;
            background: #f4f8fb;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        .sidebar a:hover {
            background: #eaf3fa;
        }
        .main-content {
            margin-left: 240px;
            padding: 2.5rem 2rem;
        }
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        .dashboard-header h3 {
            font-size: 2rem;
            color: #2980b9;
            margin: 0;
        }
        .dashboard-header .logout-btn {
            background: #c0392b;
            color: #fff;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .filter-bar {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .filter-bar label {
            font-size: 1rem;
            color: #555;
        }
        .filter-bar select, .filter-bar input {
            padding: 0.5rem 0.8rem;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
        }
        .filter-bar button {
            background: #2980b9;
            color: #fff;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        .filter-bar button.reset {
            background: #eaf3fa;
            color: #2980b9;
            border: 1px solid #2980b9;
        }
        .card-table {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(41,128,185,0.08);
            padding: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5rem;
        }
        th, td {
            padding: 0.9rem 0.7rem;
            border-bottom: 1px solid #eaf3fa;
            text-align: left;
        }
        th {
            background: #f4f8fb;
            color: #2980b9;
            font-weight: 600;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .action-btn {
            background: #2980b9;
            color: #fff;
            border: none;
            padding: 0.4rem 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 0.5rem;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .action-btn.delete {
            background: #c0392b;
        }
        @media (max-width: 900px) {
            .sidebar { position: static; width: 100%; flex-direction: row; gap: 0.5rem; padding: 1rem; }
            .main-content { margin-left: 0; padding: 1rem; }
        }
        @media (max-width: 600px) {
            .dashboard-header { flex-direction: column; gap: 1rem; }
            .filter-bar { flex-direction: column; gap: 0.5rem; }
            .card-table { padding: 0.5rem; }
            th, td { padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Dashboard</h2>
        <a href="add_car.html">Add Car</a>
        <a href="add_seller.html">Add Seller</a>
        <a href="add_customer.html">Add Customer</a>
        <a href="index.html">View All Data</a>
        <a href="view_sellers.html">View Sellers</a>
    </div>
    <div class="main-content">
        <div class="dashboard-header">
            <h3>Manage Cars</h3>
            <button class="logout-btn" onclick="window.location.href='login.html'; localStorage.removeItem('role');">Logout</button>
        </div>
        <div class="filter-bar">
            <label>
                Condition:
                <select id="filter-condition">
                    <option value="">All</option>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                </select>
            </label>
            <label>
                Status:
                <select id="filter-status">
                    <option value="">All</option>
                    <option value="Available">Available</option>
                    <option value="Sold">Sold</option>
                    <option value="Reserved">Reserved</option>
                </select>
            </label>
            <label>
                Min Price:
                <input type="number" id="filter-min-price" placeholder="0">
            </label>
            <label>
                Max Price:
                <input type="number" id="filter-max-price" placeholder="100000000">
            </label>
            <button onclick="applyFilters()">Filter</button>
            <button class="reset" onclick="resetFilters()">Reset</button>
        </div>
        <div class="card-table">
            <table id="cars-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Year</th>
                        <th>Price</th>
                        <th>Condition</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Car rows will be inserted here by JS -->
                </tbody>
            </table>
        </div>
    </div>
<script>
let allCars = [];
fetch('backend/get_cars.php')
    .then(res => res.json())
    .then(cars => {
        allCars = cars;
        renderCars(cars);
    });

function renderCars(cars) {
    const tbody = document.querySelector('#cars-table tbody');
    tbody.innerHTML = '';
    if (!cars.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">No cars found.</td></tr>';
        return;
    }
    cars.forEach(car => {
        const tr = document.createElement('tr');
        const imgSrc = car.CarImage && car.CarImage !== "" 
            ? `images/${car.CarImage}` 
            : 'images/no-image.png';
        tr.innerHTML = `
            <td>${car.CarID}</td>
            <td><img src="${imgSrc}" alt="Car Image" style="width:60px;height:40px;object-fit:cover;border-radius:6px;"></td>
            <td>${car.Brand}</td>
            <td>${car.Model}</td>
            <td>${car.Year}</td>
            <td>${car.Price}</td>
            <td>${car.CarCondition || ''}</td>
            <td>${car.Status && car.Status.trim() !== '' ? car.Status : 'Unknown'}</td>
            <td>
                <button class="action-btn" onclick="window.location.href='backend/edit_car.php?car_id=${car.CarID}'">Edit</button>
                <button class="action-btn delete" onclick="deleteCar(${car.CarID})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);

        // Add a new row for maintenance records
        const maintTr = document.createElement('tr');
        maintTr.innerHTML = `<td colspan="9" id="maint-${car.CarID}" style="background:#f8fafc; padding:0.5em 1em;">
            <em style="color:#888;">Loading maintenance records...</em>
        </td>`;
        tbody.appendChild(maintTr);

        // Fetch and display maintenance records for this car
        fetch(`backend/view_maintenance.php?car_id=${car.CarID}`)
            .then(res => res.json())
            .then(records => {
                const maintTd = document.getElementById(`maint-${car.CarID}`);
                if (!records.length) {
                    maintTd.innerHTML = '<span style="color:#c0392b;">No maintenance records found.</span>';
                    return;
                }
                let table = `<table style="width:100%;margin-top:0.5rem;font-size:0.97em;border-collapse:collapse;">
                    <tr>
                        <th style="border-bottom:1px solid #e3e3e3;">Service Date</th>
                        <th style="border-bottom:1px solid #e3e3e3;">Description</th>
                        <th style="border-bottom:1px solid #e3e3e3;">Cost</th>
                        <th style="border-bottom:1px solid #e3e3e3;">Mechanic</th>
                        <th style="border-bottom:1px solid #e3e3e3;">Service Bill</th>
                        <th style="border-bottom:1px solid #e3e3e3;">Car Registration</th>
                    </tr>`;
                records.forEach(r => {
                    table += `<tr>
                        <td style="vertical-align:top;">${r.ServiceDate}</td>
                        <td style="vertical-align:top;">${r.Description}</td>
                        <td style="vertical-align:top;">₹${r.Cost}</td>
                        <td style="vertical-align:top;">${r.MechanicName}</td>
                        <td style="vertical-align:top;">${r.ServiceBill ? `<a href="uploads/maintenance/${r.ServiceBill}" target="_blank">View</a>` : 'N/A'}</td>
                        <td style="vertical-align:top;">${r.CarRegistration ? `<a href="uploads/maintenance/${r.CarRegistration}" target="_blank">View</a>` : 'N/A'}</td>
                    </tr>`;
                });
                table += '</table>';
                maintTd.innerHTML = `<div style="margin-top:0.5rem;"><b>Maintenance Records:</b>${table}</div>`;
            })
            .catch(() => {
                const maintTd = document.getElementById(`maint-${car.CarID}`);
                maintTd.innerHTML = '<span style="color:#c0392b;">Failed to load maintenance records.</span>';
            });
    });
}

function deleteCar(carId) {
    if (confirm('Are you sure you want to delete this car?')) {
        window.location.href = `backend/delete_car.php?car_id=${carId}`;
    }
}

function applyFilters() {
    const condition = document.getElementById('filter-condition').value;
    const status = document.getElementById('filter-status').value;
    const minPrice = parseFloat(document.getElementById('filter-min-price').value) || 0;
    const maxPrice = parseFloat(document.getElementById('filter-max-price').value) || Number.MAX_SAFE_INTEGER;

    const filtered = allCars.filter(car => {
        const price = parseFloat(car.Price);
        return (!condition || car.CarCondition === condition)
            && (!status || car.Status === status)
            && price >= minPrice
            && price <= maxPrice;
    });
    renderCars(filtered);
}

function resetFilters() {
    document.getElementById('filter-condition').value = '';
    document.getElementById('filter-status').value = '';
    document.getElementById('filter-min-price').value = '';
    document.getElementById('filter-max-price').value = '';
    renderCars(allCars);
}
</script>
</body>
</html>
