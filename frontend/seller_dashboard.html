<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Dashboard | Car Market Place</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(6, 10, 11, 0.75) 0%, rgba(8, 16, 21, 0.85) 100%),
                url('images/bmw.jpg') no-repeat center center fixed;
            background-size: cover;
            
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 2rem;
            animation: fadeIn 1s;
            position: relative;
            z-index: 1;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(40px);}
            to { opacity: 1; transform: translateY(0);}
        }
        h2 { color: #2980b9; text-align: center; }
        .dashboard-links {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 2rem;
        }
        .dashboard-links a {
            background: linear-gradient(90deg, #27ae60 60%, #6dd5fa 100%);
            color: #fff;
            padding: 1rem;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.1rem;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(39,174,96,0.10);
            transition: background 0.2s, transform 0.1s;
        }
        .dashboard-links a:hover {
            background: linear-gradient(90deg, #219150 60%, #51c6f7 100%);
            transform: translateY(-2px) scale(1.02);
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="container">
        <h2>Seller Dashboard</h2>
        <div class="dashboard-links">
            <a href="add_car.html">Add Car</a>
            <a href="add_seller.html">Add Seller</a>
            <a href="view_sellers.html">View My Cars</a>
            <a href="login.html">Logout</a>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('success')) {
            let msg = '';
            switch(params.get('success')) {
                case 'car_added': msg = 'Car added successfully!'; break;
                case 'seller_added': msg = 'Seller added successfully!'; break;
                case 'customer_added': msg = 'Customer added successfully!'; break;
                case 'booking_added': msg = 'Booking completed successfully!'; break;
                case 'payment_done': msg = 'Payment successful!'; break;
                default: msg = 'Operation successful!';
            }
            alert(msg);
        }
    </script>
</body>
</html>
